name: SD Card Controller IP Tests

on:
  # Manual trigger (workflow_dispatch)
  workflow_dispatch:

  # Uncomment the lines below to enable automatic triggers
  # push:
  #   branches: [ main, develop ]
  # pull_request:
  #   branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Verilator
      run: |
        sudo apt-get update
        sudo apt-get install -y verilator
        
    # The file list is globbed rather than enumerated. The previous hand-written
    # list named every module with an sd_ prefix while the sources use sdcard_,
    # so all 16 paths were wrong and this job could only ever fail.
    - name: Run Verilator linting
      run: |
        verilator --lint-only --top-module sdcard_controller rtl/*.sv

  simulation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        simulator: [iverilog, verilator]
    steps:
    - uses: actions/checkout@v4
    
    - name: Install ${{ matrix.simulator }}
      run: |
        sudo apt-get update
        if [ "${{ matrix.simulator }}" = "iverilog" ]; then
          sudo apt-get install -y iverilog
        elif [ "${{ matrix.simulator }}" = "verilator" ]; then
          sudo apt-get install -y verilator
        fi
        
    - name: Run simulation tests
      run: |
        cd tb
        make SIM=${{ matrix.simulator }} run

  cocotb-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cocotb pytest pytest-cov
        
    - name: Install Verilator
      run: |
        sudo apt-get update
        sudo apt-get install -y verilator
        
    - name: Run cocotb tests
      run: |
        cd tb
        make SIM=cocotb run

  synthesis:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Yosys
      run: |
        sudo apt-get update
        sudo apt-get install -y yosys
        
    # Generic synthesis, not synth_sky130: that command does not exist in Yosys
    # (there is no sky130 target script), so this job aborted on the first line.
    # Mapping to sky130 standard cells needs the PDK liberty and belongs in the
    # OpenLane flow, not in a smoke test.
    #
    # KNOWN FAILURE: Yosys's built-in Verilog frontend cannot parse SystemVerilog
    # assignment patterns ('{...}), which four modules use to reset arrays —
    # calibration, debug, interrupt and error controllers. It reports these as
    # "syntax error, unexpected OP_CAST". Verified against Yosys 0.62. Fixing it
    # needs either an SV-capable frontend (yosys-slang / synlig) installed here,
    # or those four resets rewritten as loops. Verilator parses them fine.
    - name: Run synthesis
      run: |
        yosys -p "synth -top sdcard_controller; write_json flow/openlane/sdcard_controller.json" \
          rtl/*.sv

  documentation:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Check documentation
      run: |
        # Check if all required documentation files exist
        test -f docs/sd_card_controller_design_spec.md
        test -f docs/architecture.md
        test -f docs/overview.md
        test -f docs/user_guide.md
        test -f docs/api_reference.md
        test -f README.md
        
    - name: Validate markdown
      run: |
        # Basic markdown validation
        find docs/ -name "*.md" -exec echo "Checking {}" \;
        find docs/ -name "*.md" -exec grep -l "TODO" {} \; || true

  coverage:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install cocotb pytest pytest-cov coverage
        
    - name: Install Verilator
      run: |
        sudo apt-get update
        sudo apt-get install -y verilator
        
    - name: Run coverage tests
      run: |
        cd tb
        make SIM=cocotb coverage

    # tb/Makefile's coverage target is still a TODO stub that only echoes, so
    # no report is produced yet. The upload previously pointed at ./coverage.xml
    # from the repo root — a path nothing writes, and one directory above where
    # the target would write it. Guard on the file so this skips today and works
    # unchanged once coverage is actually implemented.
    - name: Check for coverage report
      id: cov
      run: |
        if [ -f tb/coverage.xml ]; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
          echo "::notice::No tb/coverage.xml — tb/Makefile coverage target is a stub. Skipping upload."
        fi

    - name: Upload coverage reports
      if: steps.cov.outputs.found == 'true'
      uses: codecov/codecov-action@v5
      with:
        files: ./tb/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false 